<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Calcolatrice Orario Lavoro</title>
<script>
  // il tema scelto si applica prima del primo disegno, cosi la pagina non lampeggia
  // col tema sbagliato; senza una scelta salvata vale quello del sistema
  (function(){
    try{
      var t = localStorage.getItem('tema');
      if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#15181d; --muted:#697386;
    --line:#e3e6ec; --accent:#2f6df6;
    --ok:#1f8a4c; --warn:#a4690a; --err:#c8322b;
    --radius:14px;
    color-scheme:light;
  }
  /* scuro se lo chiede il sistema e l'utente non ha scelto il chiaro... */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318; --card:#1a1d24; --ink:#eef1f6; --muted:#98a1b3;
      --line:#2a2f39; --accent:#6d9bff;
      --ok:#5fd08c; --warn:#e8b45c; --err:#ff7a70;
      color-scheme:dark;
    }
  }
  /* ...o se l'utente l'ha scelto esplicitamente */
  :root[data-theme="dark"]{
    --bg:#111318; --card:#1a1d24; --ink:#eef1f6; --muted:#98a1b3;
    --line:#2a2f39; --accent:#6d9bff;
    --ok:#5fd08c; --warn:#e8b45c; --err:#ff7a70;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 80px; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh; display:flex;
  }
  /* il margin:auto centra nello spazio che resta: il padding asimmetrico tiene le
     sezioni un po sopra la meta esatta, e su schermi bassi si azzera senza tagliare */
  .app{max-width:520px; width:100%; margin:auto; display:flex; flex-direction:column; gap:16px}

  /* il cambio tema e un'impostazione dell'interfaccia, non un dato del calcolo:
     sta in alto a destra, fuori dalle schede, dove ci si aspetta di trovarlo */
  .top{display:flex; justify-content:flex-end; margin-bottom:-6px}
  .tema{
    display:grid; place-items:center; width:40px; height:40px; padding:0;
    color:var(--muted); background:var(--card); border:1px solid var(--line);
    border-radius:11px; cursor:pointer; transition:color .12s;
  }
  .tema:hover{color:var(--ink)}
  .tema:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .tema svg{width:18px; height:18px; display:block}

  /* l'icona mostra il tema verso cui si passa: luna sul chiaro, sole sullo scuro.
     La sceglie il CSS, cosi e gia giusta al primo disegno */
  .tema .ico-sole{display:none}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tema .ico-sole{display:block}
    :root:not([data-theme="light"]) .tema .ico-luna{display:none}
  }
  :root[data-theme="dark"] .tema .ico-sole{display:block}
  :root[data-theme="dark"] .tema .ico-luna{display:none}

  .sub{font-size:12px; color:var(--muted)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
        display:flex; flex-direction:column; gap:18px}
  .field{display:flex; flex-direction:column; gap:7px}
  label, .lbl{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.01em}

  /* ingresso e uscita stanno affiancati finche c'e spazio */
  .orari{display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:14px}
  .orari .field{min-width:0}
  .head{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:22px}
  .head label{line-height:22px}
  input[type=time]{
    font:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; width:100%;
    font-size:20px; font-variant-numeric:tabular-nums; font-weight:600;
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  input[aria-invalid=true]{border-color:var(--err)}
  input[aria-invalid=true]:focus{outline-color:var(--err); border-color:transparent}

  .now{
    font:inherit; font-size:12px; font-weight:700; color:var(--accent);
    background:none; border:0; border-radius:8px; padding:2px 8px; line-height:18px; cursor:pointer;
  }
  .now:hover{background:var(--bg)}
  .now:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--bg);
       border:1px solid var(--line); border-radius:11px; padding:4px}
  .seg input{position:absolute; opacity:0; pointer-events:none}
  .seg label{
    position:relative;
    display:block; text-align:center; padding:11px 2px; border-radius:8px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--muted); user-select:none; transition:.12s;
  }
  .seg input:checked + label{background:var(--accent); color:#fff}
  .seg input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}

  /* separatore verticale nello spazio tra un tasto e l'altro */
  .seg label::before{
    content:''; position:absolute; left:-3.5px; top:22%; bottom:22%;
    width:1px; background:var(--line); transition:opacity .12s;
  }
  .seg label:first-of-type::before,               /* primo tasto */
  .seg input:checked + label::before,             /* accanto al tasto attivo */
  .seg input:checked + label + input + label::before{opacity:0}

  .out{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .out-main{padding:18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .out-main .k{font-size:18px; font-weight:600; color:var(--muted)}
  .out-main .v{font-size:38px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1}
  /* se il valore va a capo resta comunque a destra */
  .out-main .v{margin-left:auto; text-align:right}
  .out-main .v.vuoto{font-size:17px; font-weight:600; color:var(--muted); letter-spacing:0}
  .out-main .v.err{color:var(--err)}
  .out-main .v.pos{color:var(--ok)}
  .out-main .v.neg{color:var(--warn)}

  /* ogni colonna ha la sua barra, tra gli orari di uscita e quanto manca: si riempie
     dall'ingresso fino all'ultimo obiettivo della colonna, che e la fine della barra.
     Sopra il riempimento blu, la parte gia conquistata e verde */
  .barra{margin-top:9px}
  .barra-track{position:relative; height:8px; border-radius:99px; overflow:hidden;
               background:var(--bg); border:1px solid var(--line)}
  .barra-fill, .barra-fatto{height:100%; width:0; border-radius:99px; transition:width .3s ease}
  .barra-fill{background:var(--accent)}
  .barra-fatto{position:absolute; left:0; top:0; background:var(--ok)}
  /* tacca tra un traguardo e l'altro, nel colore della scheda: sembra un taglio nella barra */
  .barra-tacca{position:absolute; top:0; bottom:0; width:2px; margin-left:-1px;
               background:var(--card); z-index:1}
  @media (prefers-reduced-motion: reduce){
    .barra-fill, .barra-fatto{transition:none}
  }

  /* la griglia ha tre colonne a ogni larghezza: il turno ne occupa una, i buoni due.
     Il subgrid allinea titolo, orario, barra e stato tra le colonne anche quando
     un testo va a capo */
  .stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
         grid-template-rows:auto auto auto auto; border-top:1px solid var(--line)}
  .stat{display:grid; grid-row:span 4; grid-template-rows:subgrid;
        padding:13px 14px; border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat.buoni{grid-column:span 2}
  .stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700}
  .stat .ora{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px}
  .stat .sub{font-variant-numeric:tabular-nums; margin-top:5px}
  .g{font-size:.72em; font-weight:600; margin-left:1px}  /* suffisso +1g */
  .stat.hit .k, .stat.hit .ora, .stat.hit .sub{color:var(--ok)}

  /* i buoni: un tratto di barra uguale per ciascuno, e sopra e sotto ogni tratto il
     suo orario e il suo stato, allineati a destra cioe alla sua tacca */
  .tappe{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr)}
  .tappe > *{text-align:right; padding-left:8px}
  /* sotto ogni tratto: l'importo come pastiglia, e accanto quanto manca; se non
     c'e spazio lo stato va sotto la pastiglia, mai dentro una delle due */
  .tappe .sub{display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:3px 6px}
  .tappe .sub > *{white-space:nowrap}
  .tappe .val:empty{display:none}

  /* l'importo dice lo stato del buono:
     - da raggiungere: contorno e testo smorzato
     - spetta (il piu alto raggiunto): pieno, verde, con la spunta
     - superato da uno piu alto: barrato, perche non si somma */
  .imp{font-size:12px; font-weight:700; line-height:18px; padding:0 7px; border-radius:99px;
       border:1px solid var(--line); color:var(--muted); transition:background-color .15s, color .15s}
  .spetta .imp{background:var(--ok); border-color:var(--ok); color:var(--card)}
  .spetta .imp::before{content:'✓ '}
  .superato .imp{text-decoration:line-through; opacity:.75}
  .tappe .ora.spetta{color:var(--ok)}
  .tappe .ora.superato{color:var(--muted)}
  .stat.buoni.preso .k{color:var(--ok)}

  @media (max-width:420px){
    .stat{padding:12px 9px}
    .stat .k{letter-spacing:.02em}
  }

  /* in attesa dei dati: i valori sono segnaposto, le etichette restano leggibili */
  .stat .ora, .stat .val{transition:opacity .15s}
  .attesa .stat .val{opacity:.4}
  .attesa-orari .stat .ora{opacity:.4}
</style>
</head>
<body>
<main class="app">

  <header class="top">
    <button type="button" class="tema" id="tema" aria-label="Cambia tema">
      <svg class="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="ico-sole" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </header>

  <section class="card">
    <div class="orari">
      <div class="field">
        <div class="head"><label for="ingresso">Ingresso</label></div>
        <input type="time" id="ingresso" step="60" autofocus>
      </div>

      <div class="field">
        <div class="head">
          <label for="uscita">Uscita</label>
          <button type="button" class="now" id="adesso">Adesso</button>
        </div>
        <input type="time" id="uscita" step="60">
      </div>
    </div>

    <div class="field">
      <span class="lbl" id="lblTurno">Turno</span>
      <div class="seg" role="radiogroup" aria-labelledby="lblTurno">
        <input type="radio" name="turno" id="t6" value="360" checked><label for="t6">Corta</label>
        <input type="radio" name="turno" id="t712" value="432"><label for="t712">7:12</label>
        <input type="radio" name="turno" id="t9" value="540"><label for="t9">Lunga</label>
      </div>
    </div>
  </section>

  <section class="out">
    <div class="out-main">
      <span class="k">Straordinario</span>
      <span class="v" id="extra" role="status">--:--</span>
    </div>
    <!-- ogni colonna: titolo, orari di uscita, barra, quanto manca. Le barre, e gli
         orari e gli stati dei buoni, li aggiunge lo script, cosi importi e soglie
         stanno in un posto solo (BUONI) -->
    <div class="stats">
      <div class="stat" id="rowT">
        <div class="k">Turno</div>
        <div class="ora">--:--</div>
        <div class="sub val">&mdash;</div>
      </div>
      <div class="stat buoni" id="rowB">
        <div class="k">Buono pasto</div>
        <div class="tappe" id="buoniOra"></div>
        <div class="tappe" id="buoniStato"></div>
      </div>
    </div>
  </section>

</main>

<script>
(function(){
  var GIORNO = 1440;       // minuti in un giorno
  var PAUSA = 30;          // minuti scalati per la pausa pranzo
  var SOGLIA_PAUSA = 390;  // 6:30 di permanenza
  var INGRESSO_DEF = '08:00';  // da dove parte la prima selezione dell'ingresso

  // I buoni pasto, dal piu basso al piu alto: unica fonte di soglie e importi.
  // 'lavoro' e il lavoro effettivo richiesto, la permanenza necessaria si ricava.
  // Ne spetta uno solo, il piu alto raggiunto.
  var BUONI = [
    { lavoro:420, importo:'5,60 €' },
    { lavoro:540, importo:'7,00 €' }
  ];

  function el(id){ return document.getElementById(id); }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function parseOra(v){
    var m = /^(\d{1,2}):(\d{2})$/.exec(v || '');
    if(!m){ return null; }
    var h = +m[1], mi = +m[2];
    if(h > 23 || mi > 59){ return null; }
    return h * 60 + mi;
  }

  function oraCorrente(){
    var d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function fmtDurata(min){
    return Math.floor(min / 60) + ':' + pad(min % 60);
  }

  // permanenza -> lavoro effettivo: la pausa scatta da sola oltre la soglia
  function lavoroDa(p){ return p >= SOGLIA_PAUSA ? p - PAUSA : p; }

  // lavoro effettivo desiderato -> permanenza necessaria
  function permanenzaPer(l){ return l < SOGLIA_PAUSA ? l : l + PAUSA; }

  // una barra di avanzamento vuota, pronta da mettere in una colonna
  function nuovaBarra(){
    var b = document.createElement('div');
    b.className = 'barra';
    b.setAttribute('role', 'progressbar');
    b.setAttribute('aria-valuemin', '0');
    b.setAttribute('aria-valuemax', '100');
    b.setAttribute('aria-valuenow', '0');
    b.innerHTML = '<div class="barra-track"><div class="barra-fill"></div>'
                + '<div class="barra-fatto"></div></div>';
    return b;
  }

  // gli elementi comuni di una colonna; la barra va sopra l'ultima riga,
  // lo stato, che ne dice il valore a parole
  function colonna(id){
    var r = el(id), barra = nuovaBarra();
    r.insertBefore(barra, r.lastElementChild);
    return { row:    r,
             nome:   r.querySelector('.k'),
             barra:  barra,
             traccia: barra.querySelector('.barra-track'),
             riempi: barra.querySelector('.barra-fill'),
             fatto:  barra.querySelector('.barra-fatto') };
  }

  var colTurno = colonna('rowT');
  colTurno.ora = colTurno.row.querySelector('.ora');
  colTurno.stato = colTurno.row.querySelector('.sub');

  // la colonna dei buoni ha una barra sola, divisa in un tratto uguale per buono:
  // per ciascuno, l'orario sopra la fine del suo tratto, la tacca e lo stato sotto
  var colBuoni = colonna('rowB');
  BUONI.forEach(function(b, i){
    b.perm = permanenzaPer(b.lavoro);

    b.ora = document.createElement('div');
    b.ora.className = 'ora';
    b.ora.textContent = '--:--';
    el('buoniOra').appendChild(b.ora);

    // lo stato e 'importo + valore': l'importo e un'etichetta e resta leggibile
    b.stato = document.createElement('div');
    b.stato.className = 'sub';
    var imp = b.imp = document.createElement('span');
    imp.className = 'imp';
    imp.textContent = b.importo;
    b.val = document.createElement('span');
    b.val.className = 'val';
    b.val.textContent = '—';
    b.stato.appendChild(imp);
    b.stato.appendChild(document.createTextNode(' '));
    b.stato.appendChild(b.val);
    el('buoniStato').appendChild(b.stato);

    if(i < BUONI.length - 1){
      var tacca = document.createElement('div');
      tacca.className = 'barra-tacca';
      tacca.style.left = ((i + 1) / BUONI.length * 100) + '%';
      colBuoni.traccia.appendChild(tacca);
    }
  });

  var COLONNE = [colTurno, colBuoni];

  // ogni barra prende il nome dalla sua colonna, per i lettori di schermo
  COLONNE.forEach(function(r){ r.barra.setAttribute('aria-label', r.nome.textContent); });

  // riempie la barra di una colonna fino a 'frazione', e in verde fino a 'fatto',
  // la parte gia conquistata; tutte e due sono frazioni della barra intera
  function riempi(r, frazione, fatto, testo){
    frazione = Math.min(frazione, 1);
    r.riempi.style.width = (frazione * 100) + '%';
    r.fatto.style.width = (Math.min(fatto, frazione) * 100) + '%';
    r.barra.setAttribute('aria-valuenow', Math.round(frazione * 100));
    r.barra.setAttribute('aria-valuetext', testo);
  }

  // scrive un orario, col suffisso +Ng quando cade nei giorni successivi
  function scriviOra(elem, min){
    var g = Math.floor(min / GIORNO);
    var t = ((min % GIORNO) + GIORNO) % GIORNO;
    elem.textContent = pad(Math.floor(t / 60)) + ':' + pad(t % 60);
    if(g > 0){
      var suffisso = document.createElement('span');
      suffisso.className = 'g';
      suffisso.textContent = '+' + g + 'g';
      elem.appendChild(suffisso);
    }
  }

  // stato di una colonna: quanto manca in sede, o traguardo gia raggiunto.
  // Il confronto e sulla permanenza, cosi la mezz'ora di pausa e gia dentro l'attesa.
  function segna(r, perm, obiettivo){
    var manca = obiettivo - perm, fatto = manca <= 0;
    r.stato.textContent = fatto ? '✓ raggiunto' : 'tra ' + fmtDurata(manca);
    r.row.classList.toggle('hit', fatto);
    riempi(r, perm / obiettivo, fatto ? 1 : 0,
           fmtDurata(Math.min(perm, obiettivo)) + ' di permanenza su ' + fmtDurata(obiettivo));
  }

  // stato della colonna dei buoni. Ogni tratto della barra va dal traguardo
  // precedente (o dall'ingresso) al suo, e si riempie in proporzione al tempo passato
  // tra i due; e verde fino all'ultimo buono raggiunto. Dei buoni raggiunti
  // spetta solo il piu alto: gli altri risultano superati
  function segnaBuoni(perm){
    var n = BUONI.length, presi = 0, frazione = 0;
    BUONI.forEach(function(b, i){
      var manca = b.perm - perm, fatto = manca <= 0;
      var da = i ? BUONI[i - 1].perm : 0, tratto = b.perm - da;
      b.val.textContent = fatto ? '' : 'tra ' + fmtDurata(manca);
      if(fatto){ presi = i + 1; }
      frazione += (tratto > 0 ? Math.max(0, Math.min(1, (perm - da) / tratto)) : +fatto) / n;
    });
    statoBuoni(presi);

    // a parole: quale buono spetta e quanto manca al prossimo
    var prossimo = BUONI[presi];
    riempi(colBuoni, frazione, presi / n,
           (presi ? 'Spetta il buono da ' + BUONI[presi - 1].importo : 'Nessun buono ancora')
           + (prossimo ? ', quello da ' + prossimo.importo + ' tra ' + fmtDurata(prossimo.perm - perm) : ''));
  }

  // segna quale buono spetta (i primi 'presi' sono raggiunti, conta l'ultimo)
  function statoBuoni(presi){
    BUONI.forEach(function(b, i){
      var spetta = i === presi - 1, superato = i < presi - 1;
      [b.ora, b.stato].forEach(function(e){
        e.classList.toggle('spetta', spetta);
        e.classList.toggle('superato', superato);
      });
      b.imp.title = spetta ? 'Ti spetta questo buono'
                  : superato ? 'Sostituito dal buono da ' + BUONI[presi - 1].importo
                  : '';
    });
    colBuoni.row.classList.toggle('preso', presi > 0);
  }

  // un campo vuoto non e un errore da segnalare, e solo un dato che manca
  function attesaDi(campo){
    return el(campo).value ? 'orario non valido' : "inserisci l'" + campo;
  }

  function turnoSel(){ return document.querySelector('input[name=turno]:checked'); }

  // azzera lo stato attuale; gli orari di uscita restano gestiti da calcola()
  function resetStato(msg){
    el('extra').className = 'v vuoto';
    el('extra').textContent = msg;
    colTurno.stato.textContent = '—';
    colTurno.row.classList.remove('hit');
    BUONI.forEach(function(b){ b.val.textContent = '—'; });
    statoBuoni(0);
    COLONNE.forEach(function(r){ riempi(r, 0, 0, 'in attesa degli orari'); });
  }

  function calcola(){
    var turno = +turnoSel().value;
    var permTurno = permanenzaPer(turno);

    var start = parseOra(el('ingresso').value);
    var end   = parseOra(el('uscita').value);

    // l'uscita non puo precedere l'ingresso: il min guida il timepicker,
    // ma un orario scritto a mano, o un ingresso spostato dopo, va comunque respinto
    var anticipata = start !== null && end !== null && end < start;
    el('uscita').min = start === null ? '' : el('ingresso').value;
    el('uscita').setAttribute('aria-invalid', anticipata ? 'true' : 'false');

    // i valori che non si possono ancora calcolare restano visibili ma smorzati
    document.body.classList.toggle('attesa', start === null || end === null || anticipata);
    document.body.classList.toggle('attesa-orari', start === null);

    // senza ingresso non c'e nessun orario da proporre
    if(start === null){
      resetStato(attesaDi('ingresso'));
      colTurno.ora.textContent = '--:--';
      BUONI.forEach(function(b){ b.ora.textContent = '--:--'; });
      return;
    }

    scriviOra(colTurno.ora, start + permTurno);
    BUONI.forEach(function(b){ scriviOra(b.ora, start + b.perm); });

    if(end === null){
      resetStato(attesaDi('uscita'));
      return;
    }

    if(anticipata){
      resetStato("l'uscita precede l'ingresso");
      el('extra').classList.add('err');
      return;
    }

    var perm  = end - start;
    var extra = lavoroDa(perm) - turno;

    el('extra').className = 'v ' + (extra > 0 ? 'pos' : extra < 0 ? 'neg' : '');
    el('extra').textContent = (extra > 0 ? '+' : extra < 0 ? '−' : '')
                            + fmtDurata(Math.abs(extra));

    segna(colTurno, perm, permTurno);
    segnaBuoni(perm);
  }

  document.addEventListener('input', calcola);
  document.addEventListener('change', calcola);

  // Il campo ingresso nasce vuoto, e su un campo vuoto il browser aprirebbe il
  // timepicker sull'ora corrente. Alla prima interazione lo portiamo a INGRESSO_DEF,
  // cosi la selezione parte da li. Non si aggancia a 'focus' perche l'autofocus
  // iniziale non e una scelta dell'utente: il campo deve restare vuoto al caricamento.
  function proponiIngresso(){
    if(el('ingresso').value){ return false; }
    el('ingresso').value = INGRESSO_DEF;
    salvaIngresso();
    calcola();
    return true;
  }

  el('ingresso').addEventListener('pointerdown', proponiIngresso);
  el('ingresso').addEventListener('keydown', function(e){
    // il primo tasto deve fermarsi alle 8:00, non incrementarle
    if(/^(Arrow(Up|Down)|Page(Up|Down))$/.test(e.key) && proponiIngresso()){
      e.preventDefault();
    }
  });

  el('adesso').addEventListener('click', function(){
    el('uscita').value = oraCorrente();
    calcola();
  });

  // ---- ingresso di oggi ----
  // L'ingresso resta nel browser (localStorage) insieme alla data, cosi sopravvive
  // a una ricarica o alla chiusura della scheda. Vale solo per il giorno in cui e
  // stato inserito: un salvataggio di un altro giorno si scarta.
  var CHIAVE_INGRESSO = 'ingresso';

  function oggi(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  // il giorno a cui si riferisce quello che c'e sulla pagina
  var giornoPagina = oggi();

  function salvaIngresso(){
    var v = el('ingresso').value;
    giornoPagina = oggi();  // chi sta scrivendo adesso, lavora oggi
    try{
      if(parseOra(v) === null){ localStorage.removeItem(CHIAVE_INGRESSO); }
      else{ localStorage.setItem(CHIAVE_INGRESSO, JSON.stringify({ giorno: giornoPagina, ora: v })); }
    }catch(e){}
  }

  // rimette nel campo l'ingresso salvato se e di oggi, altrimenti lo cancella
  function ripristinaIngresso(){
    var s = null;
    try{ s = JSON.parse(localStorage.getItem(CHIAVE_INGRESSO)); }catch(e){}
    if(s && s.giorno === oggi() && parseOra(s.ora) !== null){
      el('ingresso').value = s.ora;
      return;
    }
    try{ localStorage.removeItem(CHIAVE_INGRESSO); }catch(e){}
  }

  el('ingresso').addEventListener('input', salvaIngresso);
  el('ingresso').addEventListener('change', salvaIngresso);

  // Una pagina rimasta aperta da ieri (tipico sul telefono) al ritorno riparte
  // come un'apertura nuova: ingresso di oggi se c'e, altrimenti vuoto, e uscita
  // all'ora corrente
  function controllaGiorno(){
    if(giornoPagina === oggi()){ return; }
    giornoPagina = oggi();
    el('ingresso').value = '';
    ripristinaIngresso();
    el('uscita').value = oraCorrente();
    calcola();
  }
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ controllaGiorno(); }
  });
  window.addEventListener('pageshow', controllaGiorno);

  // ---- turno ----
  // L'ultimo turno scelto resta salvato finche non lo cambi, anche nei giorni
  // successivi: di solito si ripete, e cosi non va riselezionato ogni mattina.
  var CHIAVE_TURNO = 'turno';
  var RADIO_TURNO = document.querySelectorAll('input[name=turno]');

  function salvaTurno(){
    try{ localStorage.setItem(CHIAVE_TURNO, turnoSel().value); }catch(e){}
  }

  // rimette il turno salvato; un valore che non corrisponde piu a nessun
  // pulsante (per esempio dopo aver cambiato i turni nel markup) si scarta
  function ripristinaTurno(){
    var v = null;
    try{ v = localStorage.getItem(CHIAVE_TURNO); }catch(e){}
    if(v === null){ return; }
    for(var i = 0; i < RADIO_TURNO.length; i++){
      if(RADIO_TURNO[i].value === v){ RADIO_TURNO[i].checked = true; return; }
    }
    try{ localStorage.removeItem(CHIAVE_TURNO); }catch(e){}
  }

  for(var i = 0; i < RADIO_TURNO.length; i++){
    RADIO_TURNO[i].addEventListener('change', salvaTurno);
  }

  // ---- tema ----
  // Di base la pagina segue il sistema. Un clic sceglie l'altro tema e lo ricorda;
  // se la scelta torna a coincidere col sistema la si dimentica, e la pagina
  // ricomincia a seguirlo (anche quando il sistema passa da solo al buio la sera).
  var radice = document.documentElement;
  var mqScuro = window.matchMedia('(prefers-color-scheme: dark)');

  function temaSistema(){ return mqScuro.matches ? 'dark' : 'light'; }
  function temaAttivo(){ return radice.getAttribute('data-theme') || temaSistema(); }

  // l'etichetta dice cosa fa il tasto, non lo stato attuale
  function aggiornaTastoTema(){
    var lbl = temaAttivo() === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro';
    el('tema').setAttribute('aria-label', lbl);
    el('tema').title = lbl;
  }

  function applicaTema(t){
    if(t === temaSistema()){
      radice.removeAttribute('data-theme');
      try{ localStorage.removeItem('tema'); }catch(e){}
    }else{
      radice.setAttribute('data-theme', t);
      try{ localStorage.setItem('tema', t); }catch(e){}
    }
    aggiornaTastoTema();
  }

  el('tema').addEventListener('click', function(){
    applicaTema(temaAttivo() === 'dark' ? 'light' : 'dark');
  });

  // il sistema cambia tema: se ora coincide con la scelta salvata, questa non serve piu
  function sistemaCambiato(){
    var t = radice.getAttribute('data-theme');
    if(t){ applicaTema(t); }else{ aggiornaTastoTema(); }
  }
  if(mqScuro.addEventListener){ mqScuro.addEventListener('change', sistemaCambiato); }
  else if(mqScuro.addListener){ mqScuro.addListener(sistemaCambiato); }

  // una scelta fatta in un'altra scheda vale anche qui
  window.addEventListener('storage', function(e){
    if(e.key !== 'tema'){ return; }
    if(e.newValue === 'light' || e.newValue === 'dark'){ radice.setAttribute('data-theme', e.newValue); }
    else{ radice.removeAttribute('data-theme'); }
    aggiornaTastoTema();
  });

  aggiornaTastoTema();

  // tornano l'ultimo turno e l'ingresso se e di oggi; l'uscita parte dall'ora corrente
  ripristinaTurno();
  ripristinaIngresso();
  el('uscita').value = oraCorrente();
  calcola();
})();
</script>
</body>
</html>
